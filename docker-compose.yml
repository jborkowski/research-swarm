version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - REPO_PATH=/app/research-output
    depends_on:
      - redis
    volumes:
      - ./research-output:/app/research-output
      - ./outputs:/app/outputs

  worker:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379
      - REPO_PATH=/app/research-output
    depends_on:
      - redis
    volumes:
      - ./research-output:/app/research-output
      - ./outputs:/app/outputs
    command: python -m orchestrator.worker

volumes:
  redis_data: